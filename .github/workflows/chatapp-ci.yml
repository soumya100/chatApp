name: ChatApp CI

# Stated requirement R-TEST-1 (see the PR #12 description): every fix ships
# with its regression tests, and the repository's own gates must run in CI on
# every pull request — unit and API regression suites, TypeScript typecheck,
# lint, real-Redis Lua integration, production build with cross-browser HTTP
# and browser smoke, OWASP ZAP passive/active VAPT, dependency review, CodeQL
# and secret scanning. The jobs below implement exactly that requirement.

on:
  pull_request:
    branches:
      - main
      - feat/complete-group-experience
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-flight validation run when another commit or a
# manual retry targets the same PR. The PR quality gate requires every job
# to finish; cancel-in-progress caused healthy security/build jobs to be
# marked cancelled and made the gate fail without reporting a code defect.
concurrency:
  group: chatapp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-static:
    name: Unit, API regression and static checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Activate Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Event poll API, authorization and security regression suite
        run: yarn test:events

      - name: Unit and API regression suite
        run: yarn test

      - name: Security and source regression contracts
        run: yarn test:security

      - name: TypeScript typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Validate staging test script syntax
        run: node --check scripts/staging-validation.cjs

  redis-lua-integration:
    name: Real Redis Lua integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run real Redis integration tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_INTEGRATION_ALLOW_FLUSHDB: "1"
        run: yarn test:redis

  build-and-browser-smoke:
    name: Production build, HTTP and cross-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-and-static
    env:
      # Non-production bootstrap values for `next build` and the started
      # production server. Credential-shaped variables (secrets, tokens) are
      # NOT committed here: the first step of this job generates fresh random
      # values per run, so no credential material ever lives in the repository.
      # They are job-scoped (never workflow-level) and never valid in any
      # deployed environment.
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      NEXTAUTH_URL: http://localhost:3100
      PUSHER_APP_ID: "123456"
      NEXT_PUBLIC_PUSHER_APP_KEY: ci-only-placeholder
      PUSHER_APP_CLUSTER: ap2
      NEXT_PUBLIC_PUSHER_APP_CLUSTER: ap2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate ephemeral CI-only credentials
        run: |
          # Fresh random values per run: nothing credential-shaped is committed
          # to the repository, and nothing generated here outlives the job.
          {
            NEXTAUTH_SECRET="$(openssl rand -base64 32)"
            UPSTASH_REDIS_REST_TOKEN="$(openssl rand -base64 24)"
            PUSHER_APP_SECRET="$(openssl rand -hex 20)"
            BLOB_READ_WRITE_TOKEN="$(openssl rand -base64 24)"
            # Mask ephemeral values before adding them to the job environment.
            echo "::add-mask::$NEXTAUTH_SECRET"
            echo "::add-mask::$UPSTASH_REDIS_REST_TOKEN"
            echo "::add-mask::$PUSHER_APP_SECRET"
            echo "::add-mask::$BLOB_READ_WRITE_TOKEN"
            {
              echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
              echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN"
              echo "PUSHER_APP_SECRET=$PUSHER_APP_SECRET"
              echo "BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN"
            } >> "$GITHUB_ENV"
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Audit production and development dependencies
        run: yarn audit:security

      - name: Build production bundle
        run: yarn build

      - name: Install pinned Playwright, browser engines and Linux dependencies
        run: |
          npm install --global playwright@1.65.1
          # Install the exact OS libraries required by all three pinned engines.
          # Browser downloads alone do not install WebKit's GTK/GStreamer stack;
          # Chromium and Firefox may start while WebKit fails at launch.
          playwright install chromium firefox webkit
          playwright install-deps chromium firefox webkit

      - name: Start production server
        run: |
          yarn start --port 3100 > /tmp/chatapp-next.log 2>&1 &
          echo $! > /tmp/chatapp-next.pid

      - name: Wait for production server
        env:
          CHATAPP_SMOKE_URL: http://127.0.0.1:3100
        run: node scripts/wait-for-server.cjs

      - name: HTTP smoke and unauthenticated API matrix
        env:
          CHATAPP_SMOKE_URL: http://127.0.0.1:3100
        run: yarn test:smoke

      - name: Chromium, Firefox and WebKit UI smoke
        env:
          CHATAPP_SMOKE_URL: http://127.0.0.1:3100
        run: |
          export NODE_PATH="$(npm root -g)"
          yarn test:browser

      - name: Upload production server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-smoke-server-log
          path: /tmp/chatapp-next.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/chatapp-next.pid ]; then
            kill "$(cat /tmp/chatapp-next.pid)" || true
          fi

  vapt:
    name: OWASP ZAP passive VAPT baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-and-static
    env:
      # Non-production bootstrap values for `next build` and the started
      # production server. Credential-shaped variables (secrets, tokens) are
      # NOT committed here: the first step of this job generates fresh random
      # values per run, so no credential material ever lives in the repository.
      # They are job-scoped (never workflow-level) and never valid in any
      # deployed environment.
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      NEXTAUTH_URL: http://localhost:3100
      PUSHER_APP_ID: "123456"
      NEXT_PUBLIC_PUSHER_APP_KEY: ci-only-placeholder
      PUSHER_APP_CLUSTER: ap2
      NEXT_PUBLIC_PUSHER_APP_CLUSTER: ap2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate ephemeral CI-only credentials
        run: |
          # Fresh random values per run: nothing credential-shaped is committed
          # to the repository, and nothing generated here outlives the job.
          {
            NEXTAUTH_SECRET="$(openssl rand -base64 32)"
            UPSTASH_REDIS_REST_TOKEN="$(openssl rand -base64 24)"
            PUSHER_APP_SECRET="$(openssl rand -hex 20)"
            BLOB_READ_WRITE_TOKEN="$(openssl rand -base64 24)"
            # Mask ephemeral values before adding them to the job environment.
            echo "::add-mask::$NEXTAUTH_SECRET"
            echo "::add-mask::$UPSTASH_REDIS_REST_TOKEN"
            echo "::add-mask::$PUSHER_APP_SECRET"
            echo "::add-mask::$BLOB_READ_WRITE_TOKEN"
            {
              echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
              echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN"
              echo "PUSHER_APP_SECRET=$PUSHER_APP_SECRET"
              echo "BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN"
            } >> "$GITHUB_ENV"
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build production bundle
        run: yarn build

      - name: Start production server
        run: |
          yarn start --port 3100 > /tmp/chatapp-vapt.log 2>&1 &
          echo $! > /tmp/chatapp-vapt.pid

      - name: Wait for production server
        env:
          CHATAPP_SMOKE_URL: http://127.0.0.1:3100
        run: node scripts/wait-for-server.cjs

      - name: Create the isolated scanner network
        run: |
          docker network create --driver bridge zap-scan-net
          # Second isolation layer: the packaged ZAP scan scripts hard-code
          # api.disablekey=true, so the control API cannot be protected by a
          # key. The bridge already keeps the API off the host loopback; this
          # rule additionally drops every host-originated packet to the
          # scanner API port, so even a process on the runner (including the
          # application under test) cannot reach it. The in-container scan
          # scripts talk to the API from inside the container's own network
          # namespace and are unaffected; container-to-host traffic to the
          # target (port 3100 via the gateway) uses the INPUT chain, not
          # OUTPUT, and stays open.
          BR_IF="br-$(docker network inspect zap-scan-net -f '{{.Id}}' | cut -c1-12)"
          echo "ZAP_BR_IF=$BR_IF" >> "$GITHUB_ENV"
          sudo iptables -I OUTPUT -o "$BR_IF" -p tcp --dport 8080 -j DROP

      - name: Run OWASP ZAP passive baseline scan
        id: zap
        continue-on-error: true
        # The image is pinned by digest: mutable tags would let a republished
        # image change what runs inside CI. The scanner runs on a dedicated
        # bridge network (API never published to the host, plus the OUTPUT
        # drop rule above) and reaches the target through the host gateway,
        # so the application under test can no longer reach the scanner API
        # to suppress its own findings.
        run: |
          docker run --rm --network zap-scan-net --user root \
            --add-host=host.docker.internal:host-gateway \
            --workdir /zap/wrk \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://host.docker.internal:3100 -m 3 -J zap-report.json -I

      - name: Validate ZAP report and block High/Critical findings
        if: always()
        run: node scripts/validate-zap-report.cjs zap-report.json

      - name: Upload VAPT report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zap-vapt-report
          path: zap-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if ZAP scanner reported an error
        if: steps.zap.outcome == 'failure'
        run: exit 1

      - name: Stop production server and remove the scanner network
        if: always()
        run: |
          if [ -f /tmp/chatapp-vapt.pid ]; then
            kill "$(cat /tmp/chatapp-vapt.pid)" || true
          fi
          sudo iptables -D OUTPUT -o "$ZAP_BR_IF" -p tcp --dport 8080 -j DROP || true
          docker network rm zap-scan-net || true

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/chatapp-vapt.log || true

  supply-chain-security:
    name: Dependency review and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (full history, tokenless)
        run: |
          # Digest-pinned: a mutable :latest tag would allow silent tool changes.
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source . --verbose --redact

      - name: Review new pull-request dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  codeql:
    name: CodeQL JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:javascript-typescript"

  vapt-active:
    name: OWASP ZAP active scan (unauthenticated)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-and-static
    env:
      # Non-production bootstrap values for `next build` and the started
      # production server. Credential-shaped variables (secrets, tokens) are
      # NOT committed here: the first step of this job generates fresh random
      # values per run, so no credential material ever lives in the repository.
      # They are job-scoped (never workflow-level) and never valid in any
      # deployed environment.
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      NEXTAUTH_URL: http://localhost:3100
      PUSHER_APP_ID: "123456"
      NEXT_PUBLIC_PUSHER_APP_KEY: ci-only-placeholder
      PUSHER_APP_CLUSTER: ap2
      NEXT_PUBLIC_PUSHER_APP_CLUSTER: ap2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate ephemeral CI-only credentials
        run: |
          # Fresh random values per run: nothing credential-shaped is committed
          # to the repository, and nothing generated here outlives the job.
          {
            NEXTAUTH_SECRET="$(openssl rand -base64 32)"
            UPSTASH_REDIS_REST_TOKEN="$(openssl rand -base64 24)"
            PUSHER_APP_SECRET="$(openssl rand -hex 20)"
            BLOB_READ_WRITE_TOKEN="$(openssl rand -base64 24)"
            # Mask ephemeral values before adding them to the job environment.
            echo "::add-mask::$NEXTAUTH_SECRET"
            echo "::add-mask::$UPSTASH_REDIS_REST_TOKEN"
            echo "::add-mask::$PUSHER_APP_SECRET"
            echo "::add-mask::$BLOB_READ_WRITE_TOKEN"
            {
              echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
              echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN"
              echo "PUSHER_APP_SECRET=$PUSHER_APP_SECRET"
              echo "BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN"
            } >> "$GITHUB_ENV"
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build production bundle
        run: yarn build

      - name: Start production server
        run: |
          yarn start --port 3100 > /tmp/chatapp-vapt-active.log 2>&1 &
          echo $! > /tmp/chatapp-vapt-active.pid

      - name: Wait for production server
        env:
          CHATAPP_SMOKE_URL: http://127.0.0.1:3100
        run: node scripts/wait-for-server.cjs

      - name: Create the isolated scanner network
        run: |
          docker network create --driver bridge zap-scan-net
          # Same second isolation layer as the passive scan above.
          BR_IF="br-$(docker network inspect zap-scan-net -f '{{.Id}}' | cut -c1-12)"
          echo "ZAP_BR_IF=$BR_IF" >> "$GITHUB_ENV"
          sudo iptables -I OUTPUT -o "$BR_IF" -p tcp --dport 8080 -j DROP

      - name: Run OWASP ZAP active scan
        id: zap-active
        continue-on-error: true
        # Digest-pinned and bridge-isolated for the same reasons as the
        # passive scan above.
        run: |
          docker run --rm --network zap-scan-net --user root \
            --add-host=host.docker.internal:host-gateway \
            --workdir /zap/wrk \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-full-scan.py -t http://host.docker.internal:3100 -m 5 -J zap-active-report.json -I

      - name: Validate active-scan report and block High/Critical findings
        if: always()
        run: node scripts/validate-zap-report.cjs zap-active-report.json

      - name: Upload active-scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zap-active-report
          path: zap-active-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if ZAP scanner reported an error
        if: steps.zap-active.outcome == 'failure'
        run: exit 1

      - name: Stop production server and remove the scanner network
        if: always()
        run: |
          if [ -f /tmp/chatapp-vapt-active.pid ]; then
            kill "$(cat /tmp/chatapp-vapt-active.pid)" || true
          fi
          sudo iptables -D OUTPUT -o "$ZAP_BR_IF" -p tcp --dport 8080 -j DROP || true
          docker network rm zap-scan-net || true

  pr-quality-gate:
    name: PR quality gate
    if: always()
    needs:
      - unit-and-static
      - redis-lua-integration
      - build-and-browser-smoke
      - vapt
      - vapt-active
      - supply-chain-security
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation and security job to pass
        env:
          UNIT_STATIC: ${{ needs.unit-and-static.result }}
          REDIS_INTEGRATION: ${{ needs.redis-lua-integration.result }}
          BUILD_BROWSER_SMOKE: ${{ needs.build-and-browser-smoke.result }}
          VAPT_PASSIVE: ${{ needs.vapt.result }}
          VAPT_ACTIVE: ${{ needs.vapt-active.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain-security.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          printf '%s\\n' \
            "unit/static: $UNIT_STATIC" \
            "real Redis: $REDIS_INTEGRATION" \
            "build/browser smoke: $BUILD_BROWSER_SMOKE" \
            "ZAP passive VAPT: $VAPT_PASSIVE" \
            "ZAP active VAPT: $VAPT_ACTIVE" \
            "supply-chain: $SUPPLY_CHAIN" \
            "CodeQL: $CODEQL"
          for result in "$UNIT_STATIC" "$REDIS_INTEGRATION" "$BUILD_BROWSER_SMOKE" "$VAPT_PASSIVE" "$VAPT_ACTIVE" "$SUPPLY_CHAIN" "$CODEQL"; do
            if [ "$result" != "success" ]; then
              echo "PR quality gate failed: every job must succeed."
              exit 1
            fi
          done
          echo "All PR validation and security gates passed."

  # Vercel is invoked only after the PR quality gate has confirmed that every
  # validation and security job succeeded. Automatic Vercel Git deployments
  # must be disabled in the Vercel project settings for this to be the sole path.
  deploy-vercel-preview:
    name: Deploy Vercel preview (after all CI)
    needs:
      - pr-quality-gate
    if: >-
      github.event_name == 'pull_request' &&
      needs.pr-quality-gate.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull preview environment and build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"

      - name: Deploy tested preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
