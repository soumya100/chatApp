name: Dependency and Secret Security

on:
  pull_request:
    branches: [main, feat/complete-group-experience]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Block high-severity dependency additions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks (full history, tokenless)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source . --verbose --redact
