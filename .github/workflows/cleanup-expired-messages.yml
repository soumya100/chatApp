name: Cleanup expired chat messages

on:
  # GitHub Actions schedules use UTC. Runs hourly at minute 17.
  # Scheduled workflows execute only from the repository's default branch.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-expired-chat-messages
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove expired Redis messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate scheduler configuration
        shell: bash
        env:
          CHATAPP_BASE_URL: ${{ vars.CHATAPP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CHATAPP_BASE_URL" ]]; then
            echo "::error::Repository variable CHATAPP_BASE_URL is not configured."
            exit 1
          fi
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Repository secret CRON_SECRET is not configured."
            exit 1
          fi
          if [[ ! "$CHATAPP_BASE_URL" =~ ^https:// ]]; then
            echo "::error::CHATAPP_BASE_URL must be an HTTPS origin."
            exit 1
          fi

      - name: Run expired-message cleanup
        shell: bash
        env:
          CHATAPP_BASE_URL: ${{ vars.CHATAPP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CHATAPP_BASE_URL%/}/api/cron/cleanup-expired-messages"
