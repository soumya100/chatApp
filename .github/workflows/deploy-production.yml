name: Deploy ChatApp to Vercel Production

on:
  workflow_run:
    workflows:
      - ChatApp CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatapp-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy only after all ChatApp CI gates pass
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check deployment credentials
        id: config
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment skipped: configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the production environment."
          fi

      - name: Install Vercel CLI
        if: steps.config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Link the Vercel project
        if: steps.config.outputs.configured == 'true'
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Pull production environment
        if: steps.config.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build production artifact
        if: steps.config.outputs.configured == 'true'
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: steps.config.outputs.configured == 'true'
        id: deploy
        shell: bash
        run: |
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | head -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Could not extract the Vercel deployment URL from CLI output."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed application
        if: steps.config.outputs.configured == 'true'
        env:
          CHATAPP_SMOKE_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke-test.cjs

      - name: Deployment was not configured
        if: steps.config.outputs.configured != 'true'
        run: echo "No production deployment was attempted. Configure the production environment secrets to enable release."
